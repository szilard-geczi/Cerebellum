<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>[Your Name]</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="nav">
    <div class="wrap nav__inner">
      <div class="nav__left">
        <a class="brand" href="#top">[Your Name]</a>
      </div>

      <nav class="nav__center" aria-label="Primary">
        <a href="#">Product</a>
        <a href="#">How it works</a>
        <a href="#">Pricing</a>
        <a href="#">Blog</a>
      </nav>

      <div class="nav__right">
        <a class="btn btn--primary" href="#">Start for free</a>
      </div>
    </div>
  </header>

  <main id="top" class="hero">
    <div class="wrap hero__grid">
      <section class="hero__copy">
        <!-- Controlled line breaks to match your reference -->
        <h1 class="h1">
          <span>Start calm.</span>
          <span>Stay</span>
          <span>focused.</span>
          <span>Be</span>
          <span>confident.</span>
        </h1>

        <p class="p">
          Operator-led consulting for hotels &amp; restaurants. Remove recurring issues, choose the right systems,
          and deliver change that actually sticks.
        </p>

        <div class="cta">
          <a class="btn btn--primary btn--lg" href="#">Start for free</a>
          <span class="micro">No credit card required</span>
        </div>
      </section>

      <section class="hero__visual" aria-label="Preview">
        <!-- Floating image (NO frame) -->
        <div class="floatShot">
          <div class="shotChrome" aria-hidden="true">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>

          <!-- Replace with a real screenshot later:
               <img class="shotImg" src="your-screenshot.png" alt="Product preview"> -->
          <div class="shotMock" aria-hidden="true">
            <div class="mockLeft"></div>
            <div class="mockRight"></div>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
