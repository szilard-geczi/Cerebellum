<body>
  <!-- faint lavender wash like Sunsama (almost invisible) -->
  <div class="bg" aria-hidden="true"></div>

  <header class="nav">

      <div class="nav__left">
        <a class="brand" href="#top">[Your Name]</a>

      <nav class="nav__center" aria-label="Primary">

  <main id="top" class="hero">

          Start calm.<br>
