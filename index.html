<head>

  <link rel="stylesheet" href="styles.css" />

<body>

  <!-- NAV (intentionally minimal, Sunsama-style) -->
  <header class="nav">
    <div class="nav__inner">
      <div class="logo">[Your Name]</div>

      <nav class="nav__links">

  <!-- =========================
       SUNSAMA-STYLE HERO
       ========================= -->
  <main class="hero">

    <!-- LEFT COPY (sits on white) -->
    <div class="hero__copy">
      <h1 class="hero__h1">
        Start calm.<br>
        Stay focused.<br>
        Be confident.
      </h1>

      <p class="hero__p">
        Operator-led consulting for hotels & restaurants.
        Remove recurring issues, choose the right systems,

      </p>

      <div class="hero__cta">
        <a class="btn btn--primary" href="#">Start for free</a>
        <span class="hero__micro">No credit card required</span>
      </div>
    </div>

    <!-- RIGHT VISUAL SLAB -->
    <div class="hero__slab">
      <div class="hero__shot">

        <!-- Fake browser chrome -->
        <div class="shot__top">
          <span></span><span></span><span></span>
        </div>

        <!-- Replace this entire block with REAL screenshot later -->
        <div class="shot__body">
          <div class="ui ui--sidebar"></div>
          <div class="ui ui--main"></div>

      </div>
